<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 383.45 98" role="img" aria-label="Morse Lab">
  <title>Morse Lab</title>
  <!--
    Primaeres Lockup (1.1 §3): Marke links, Wortmarke rechts, Abstand ein
    Knopfdurchmesser (30). Die Marke ist unveraendert die aus
    docs/brand/assets/morse-lab-mark.svg -- hier wird nichts nachgezeichnet
    (Ruling #88). Die Wortmarke steht in Newsreader Regular, ohne Sperrung und
    ohne Versalien; sie ist als Text ausgezeichnet, nicht in Pfade gewandelt.
    Die Breite der viewBox folgt der gemessenen Textbreite von
    209.45 px (tools/brand/derive.mjs).
    Mindestgroesse fuer dieses Lockup: 140 px Breite.
  -->
  <rect x="0" y="66" width="120" height="8" rx="4" fill="#221D16"></rect>
  <rect x="14" y="54" width="92" height="8" rx="4" fill="#221D16" transform="rotate(13 106 58)"></rect>
  <circle cx="21" cy="33" r="15" fill="#B45309"></circle>
  <circle cx="111" cy="45" r="3.5" fill="none" stroke="#221D16" stroke-width="3"></circle>
  <text x="150" y="62"
        font-family="Newsreader, Georgia, serif" font-size="46"
        font-weight="400" letter-spacing="0" fill="#221D16">Morse Lab</text>
</svg>
