<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Morse Lab">
  <title>Morse Lab</title>
  <!--
    Fallback-Marke fuer kleine Groessen (1.1 §3: unter 24 px Punkt + Pille in
    Amber). Konstruktion nach 1.1 §8: u = 64, Punkt 1u, Luecke 1u, Strich
    3u x 1u mit Radius 0.5u; echter Code: A. Review Design/UX C, nimmt
    Ruling #88 fuer das Favicon zurueck; Fable-Abnahme offen. App-Icon und
    Touch-Icon bleiben der Taster (public/icons/).
  -->
  <rect width="512" height="512" rx="116" fill="#F6F1E8"></rect>
  <circle cx="128" cy="256" r="32" fill="#B45309"></circle>
  <rect x="224" y="224" width="192" height="64" rx="32" fill="#B45309"></rect>
</svg>
