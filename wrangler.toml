# Cloudflare Pages -- Bindungen fuer die Functions in ./functions.
#
# Die Seite selbst braucht das nicht: `npm run build` und das Ausliefern von
# `dist/` laufen unveraendert weiter, auch ohne diese Datei. Sie sagt nur, dass
# die Functions eine D1-Datenbank unter dem Namen `DB` erwarten.
#
# ## Lokal
#
#   npx wrangler d1 migrations apply morse-lab --local
#   npm run build && npx wrangler pages dev dist
#
# Lokal legt Wrangler die Datenbank in `.wrangler/state/` an -- `database_id`
# spielt dabei keine Rolle, ein Login auch nicht.
#
# ## Produktion
#
# Die Datenbank **existiert** (Cloudflare-Account des Owners, Name `morse-lab`,
# Region WEUR); `migrations/0001_accounts.sql` ist dort samt Migrations-Journal
# bereits angewandt. `database_id` unten ist die echte ID dieser Datenbank.
#
# **Keine wrangler-Migrationsbefehle mehr ausfuehren** -- ein zweiter Lauf gegen
# `--remote` scheitert an bereits existierenden Tabellen.
#
# Die Bindung `DB` setzt der Git-Deploy per config-as-code aus dieser Datei:
# Pages liest `wrangler.toml` beim Build, ein Dashboard-Eintrag ist dafuer
# nicht noetig. Wirksam wird sie mit dem naechsten Deploy nach diesem Commit.

name = "projekt-morse"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "morse-lab"
database_id = "1df14984-0c7a-41a0-b839-c4855a05a82c"
migrations_dir = "migrations"
