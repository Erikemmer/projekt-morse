<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Favicon ist die Fallback-Marke aus 1.1 §3 (Punkt + Pille, Amber), weil
      der Taster bei 16-32 px zerfaellt (Review Design/UX C, Messung in
      docs/REVIEW-DESIGN-UX.md). Nimmt Ruling #88 fuer das Favicon zurueck --
      Fable-Abnahme offen. Touch- und App-Icon bleiben der Taster.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Schriften liegen als woff2 im Repo (@font-face in styles.css) -- kein Fremdabruf. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Startwert fuer <meta name="theme-color"> -- Paper, dieselbe Farbe wie
      die Grundstellung in styles.css. `ui/theme.ts` zieht sie nach jedem
      Rendern auf das tatsaechlich wirksame Theme nach; dieser Wert traegt
      nur den allerersten Moment, bevor React ueberhaupt lief.
    -->
    <meta name="theme-color" content="#f6f1e8" />
    <!--
      Die Build-Kennung fuer den About-Screen. Der Produktionsbuild ersetzt
      "dev" durch die Asset-Version aus vite.config.ts -- dieselbe, die den
      Service-Worker-Cache benennt. Bewusst kein Datum und kein Commit: die
      Kennung haengt nur am Inhalt, ein Doku-Deploy aendert sie nicht (und
      erzeugt damit weiter keinen Cache-Wechsel).
    -->
    <meta name="build" content="dev" />
    <!--
      Gegen das Aufblitzen des falschen Themes (Ruling Notion-Log #111,
      Punkt 7): das gespeicherte Theme muss am <html> stehen, BEVOR der
      Browser zum ersten Mal zeichnet -- danach ist es zu spaet, React laeuft
      erst nach diesem ersten Anstrich. Ein Modul-Skript waere dafuer zu spaet
      (es laedt asynchron); nur ein synchrones Inline-Skript im <head> kommt
      rechtzeitig. Es dupliziert zwangslaeufig den Storage-Schluessel aus
      ui/deviceStorage.ts und die Feldform aus engine/deviceSettings.ts --
      es kann von dort nicht importieren, ohne selbst ein Modul zu werden.
      Faellt "theme" auf "system" oder fehlt es, passiert nichts: dann
      entscheidet allein die CSS-Medienabfrage (prefers-color-scheme), ganz
      ohne dieses Skript.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('projekt-morse:device');
          var theme = raw && JSON.parse(raw).theme;
          if (theme && theme !== 'system') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (error) {
          // Kein Speicher (privater Modus), kaputtes JSON -- dann bleibt es
          // bei "system", nicht bei einer stehenden Seite.
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!--
      Was Suchmaschinen und Link-Vorschauen von der Startseite sehen. Die
      Learn-Seiten tragen das seit jeher (tools/learn/pages.mjs), die
      Startseite hatte nur den Titel. Die Beschreibung ist wortgleich die aus
      public/manifest.webmanifest, das Bild dasselbe wie im Learn-Bereich --
      kein neuer Wortlaut. `tools/site/verify.mjs` prueft die gebaute Datei.
    -->
    <title>Morse Lab — Learn Morse code by ear</title>
    <meta
      name="description"
      content="Learn Morse code by ear. Hear a character, answer, get feedback."
    />
    <link rel="canonical" href="https://morse-lab.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Morse Lab" />
    <meta property="og:title" content="Morse Lab — Learn Morse code by ear" />
    <meta
      property="og:description"
      content="Learn Morse code by ear. Hear a character, answer, get feedback."
    />
    <meta property="og:url" content="https://morse-lab.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://morse-lab.com/og-morse-lab.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Morse Lab" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Morse Lab",
        "url": "https://morse-lab.com/",
        "description": "Learn Morse code by ear. Hear a character, answer, get feedback.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and Web Audio.",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "image": "https://morse-lab.com/og-morse-lab.png"
      }
    </script>
    <!--
      Die zwei Schriften des ersten Bildschirms vorladen: ohne das entdeckt
      der Browser sie erst, wenn das Stylesheet da ist, und der Text springt
      beim ersten Aufruf von der Ersatzschrift um. Vite haengt denselben Hash
      an wie an die url() im Stylesheet -- es bleibt eine Datei, ein Abruf.
      `crossorigin` ist Pflicht: Schriften werden immer im CORS-Modus geholt,
      ohne das Attribut laedt der Browser sie doppelt.
    -->
    <link
      rel="preload"
      href="/src/fonts/newsreader-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/fonts/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!--
      Ohne JavaScript bliebe die Seite leer. Der Absatz sagt, was hier ist
      und wo es ohne Skript etwas zu lesen gibt. Wortlaut-Entwurf fuer den
      zweiten Satz, Fable-Abnahme offen; der erste ist die Manifest-Zeile.
    -->
    <noscript>
      <div style="max-width: 34rem; margin: 0 auto; padding: 48px 24px">
        <h1>Morse Lab</h1>
        <p>Learn Morse code by ear. Hear a character, answer, get feedback.</p>
        <p>
          The trainer needs JavaScript to play sound. The
          <a href="/learn/">guides</a> work without it.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
